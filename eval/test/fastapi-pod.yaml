apiVersion: v1
kind: Pod
metadata:
  name: fastapi
  namespace: eval
  labels:
    app: fastapi-test
spec:
  containers:
    - name: fastapi
      image: docker.io/remilaunay/k8s-dst-eval-fastapi:latest
      imagePullPolicy: Always
      command: ["uvicorn"]
      args: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      env:
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_PORT
          value: "3307"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-user
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-user
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-user
              key: MYSQL_DATABASE
      volumeMounts:
        - name: app-source
          mountPath: /app
  volumes:
    - name: app-source
      hostPath:
        path: /home/ubuntu/eval/eval/test/app
        type: Directory
