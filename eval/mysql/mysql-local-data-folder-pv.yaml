apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-local-data-folder-pv
spec:
  storageClassName: local-path
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: eval
    name: mysql-data-mysql-0
  hostPath:
    path: /home/ubuntu/eval/eval/data/mysql
    type: Directory
