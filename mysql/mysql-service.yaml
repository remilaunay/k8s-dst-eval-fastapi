apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: eval
  labels:
    app: mysql
spec:
  type: ClusterIP
  clusterIP: 10.43.0.42
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3307
      targetPort: 3306
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: eval
  labels:
    app: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
